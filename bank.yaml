# =============================================================================
#  RESUME BANK: the only place your wording lives.
#
#  Rules:
#   * Only you edit this file. The AI never writes text, it only picks IDs.
#   * Text is LaTeX-ready: escape  &  %  #  $  _  as  \&  \%  \#  \$  \_
#   * Number ranges use --  (e.g. 3.4--7.0). Never put \newline or \vspace here;
#     all spacing lives in latex/layout.tex.
#   * "group" marks bullets that say the same thing in different words.
#     The builder refuses to put two bullets from the same group on one resume.
#   * Wrap the one key result number of a bullet in \metric{...}. It prints in
#     bold only when a recipe says  bold_metrics: true. At most one per bullet.
#   * Run  python build.py check  after editing to lint the bank.
# =============================================================================

