opening: Dear Planar Motor Hiring Team,
closing: Sincerely,
body: |
  One part of engineering I've particularly enjoyed is communicating technical work and explaining how something works to others. During my master's in Mechanical and Mechatronics Engineering at the University of Waterloo, I had several opportunities to present my research and discuss technical findings with different audiences. This is part of what interested me in the Sales Engineer position at Planar Motor. I'd like to build on these experiences in a role where I can work directly with customers while continuing to use my engineering background.

  During my graduate research, I communicated my findings through six presentations to our research sponsors, including Transport Canada, as well as technical reports, a conference paper and my thesis. I also presented my research at the Injury Biomechanics Symposium at Ohio State in May 2025. Outside of my research, I was a Teaching Assistant for MTE 120 (Circuits), where I supported labs for over 100 students, helped troubleshoot hardware and explained circuit problems to students with different levels of understanding. I've found that I enjoy being able to take something technical and explain it in a way that makes sense to someone else.

  I've also had experience working with customer requirements and understanding how engineering decisions affect the final product. At Echoscope, I wrote five manufacturing and verification procedures that were approved and used by the client. During my internship at GN Corporation, I developed work instructions and SOPs based on customer specifications and existing manufacturing processes. My capstone also involved building a control and data acquisition interface for a pressurized test system using Arduino, sensors and motors. I think these experiences would help me understand Planar Motor's products and communicate their capabilities to potential customers.

  I'm eligible to work in Canada and would be happy to relocate to Richmond and travel for work. I'm also available to start immediately. I've attached my resume and transcripts for your review, and I'd appreciate the opportunity to discuss the position further.
